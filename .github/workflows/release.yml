name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Compiler and browser checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      browser-tests-ref: ${{ github.workflow_sha }}

  windows:
    name: Build and test portable Windows x64 ZIP
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: x64
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Build the allowlisted distribution
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $runtime = Split-Path (Get-Command node.exe).Source
          $folder = "AMOScript-$env:RELEASE_TAG-windows-x64"
          node tools/stage_windows_release.js "$env:RUNNER_TEMP/$folder" "$runtime" "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release assembly failed' }
          node tools/check_windows_release.js "$env:RUNNER_TEMP/$folder"
          if ($LASTEXITCODE -ne 0) { throw 'Release smoke failed' }
      - name: ZIP, extract, test and checksum
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $folder = "AMOScript-$env:RELEASE_TAG-windows-x64"
          $archive = "$folder.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP/$folder" -DestinationPath "dist/$archive"
          $extracted = "$env:RUNNER_TEMP/extracted release"
          Expand-Archive -Path "dist/$archive" -DestinationPath $extracted
          node tools/check_windows_release.js "$extracted/$folder"
          if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP smoke failed' }
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), "$hash  $archive`n", [System.Text.Encoding]::ASCII)
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run desktop:install
      - name: Configure Ubuntu package mirror
        if: runner.os == 'Linux'
        run: |
          # Avoid the runner's Azure mirror, which can persistently fail DNS.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-amoscript-retries >/dev/null
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install-deps chromium
      - name: Build native installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:dist
      - name: Test packaged Linux app
        if: runner.os == 'Linux'
        env:
          AMOSCRIPT_DESKTOP_EXECUTABLE: ${{ github.workspace }}/dist/desktop/linux-unpacked/amoscript-builder
        run: xvfb-run -a npm run test:desktop
      - name: Test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AMOSCRIPT_DESKTOP_EXECUTABLE = (Resolve-Path 'dist/desktop/win-unpacked/AMOScript Builder.exe').Path
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app smoke failed' }
      - name: Test packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable=$(find dist/desktop -path '*/AMOScript Builder.app/Contents/MacOS/AMOScript Builder' -type f | head -n 1)
          test -n "$executable"
          AMOSCRIPT_DESKTOP_EXECUTABLE="$PWD/$executable" npm run test:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-${{ runner.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tagged release
    needs: [checks, windows, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name windows-release --dir dist
          gh run download "$RUN_ID" --pattern 'desktop-release-*' --dir dist
      - name: Create release after successful packaging
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          mapfile -d '' assets < <(find dist -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes "${flags[@]}"
